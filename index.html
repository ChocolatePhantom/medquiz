            { id: 487, topic: "Средства, действующие в области адренорецепторов", question: "Какой из перечисленных бета-адреноблокаторов дополнительно блокирует альфа-1-адренорецепторы?", options: ["пропранолол", "окспренолол", "лабеталол", "атенолол"], answers: [2] },

            { id: 489, topic: "Средства, действующие в области адренорецепторов", question: "Какие адренергические средства применяют при доброкачественной гипертрофии предстательной железы?", options: ["бета-адреноблокаторы", "альфа-1-адреноблокаторы", "симпатолитики", "непрямые адреномиметики"], answers: [1] },
            { id: 490, topic: "Средства, действующие в области адренорецепторов", question: "Альфа-2-адренорецепторы", options: ["расположены преимущественно в ганглиях", "локализованы на пресинаптической мембране", "преимущественно расположены на постсинаптической мембране", "при возбуждении снижают тонус сосудодвигательного центра"], answers: [1, 3] }
        ];

        // Utility: Shuffle Array Helper
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        class MedQuizApp {
            constructor() {
                this.selectedTopic = "ALL";
                this.selectedCount = 10;
                this.activeQuestions = [];
                this.state = {
                    currentIdx: 0,
                    score: 0,
                    userAnswers: [],
                    selectedIndices: [],
                    isAnswerSubmitted: false
                };

                this.initTheme();
            }

            initTheme() {
                if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark');
                    document.getElementById('theme-icon').className = 'fa-solid fa-sun text-amber-400';
                } else {
                    document.documentElement.classList.remove('dark');
                    document.getElementById('theme-icon').className = 'fa-solid fa-moon text-slate-600';
                }
            }

            toggleTheme() {
                const isDark = document.documentElement.classList.toggle('dark');
                localStorage.theme = isDark ? 'dark' : 'light';
                document.getElementById('theme-icon').className = isDark ? 'fa-solid fa-sun text-amber-400' : 'fa-solid fa-moon text-slate-600';
            }

            confirmExitHome() {
                if (this.activeQuestions.length > 0 && this.state.currentIdx < this.activeQuestions.length && this.state.userAnswers.length > 0) {
                    if (confirm("Вы уверены, что хотите прервать тест и вернуться в главное меню? Текущий прогресс будет потерян.")) {
                        this.activeQuestions = [];
                        this.navTo('home');
                    }
                } else {
                    this.activeQuestions = [];
                    this.navTo('home');
                }
            }

            navTo(view) {
                const container = document.getElementById('app-container');
                const exitBtn = document.getElementById('exit-btn');
                container.innerHTML = '';

                if (view === 'home') {
                    if (exitBtn) exitBtn.classList.add('hidden');
                    this.renderHome(container);
                } else if (view === 'play') {
                    if (exitBtn) exitBtn.classList.remove('hidden');
                    this.renderPlay(container);
                } else if (view === 'result') {
                    if (exitBtn) exitBtn.classList.add('hidden');
                    this.renderResult(container);
                }
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            getUniqueTopics() {
                const topics = new Set();
                fullQuestionBank.forEach(q => topics.add(q.topic));
                return Array.from(topics);
            }

            getFilteredQuestions() {
                if (this.selectedTopic === "ALL") {
                    return fullQuestionBank;
                }
                return fullQuestionBank.filter(q => q.topic === this.selectedTopic);
            }

            renderHome(container) {
                const topics = this.getUniqueTopics();
                const availableQuestions = this.getFilteredQuestions();

                container.innerHTML = `
                    <div class="max-w-2xl mx-auto space-y-6">
                        <div class="bg-gradient-to-br from-teal-600 to-emerald-700 rounded-3xl p-8 text-white shadow-xl relative overflow-hidden">
                            <div class="relative z-10">
                                <span class="inline-block px-3 py-1 rounded-full bg-white/20 text-xs font-semibold uppercase tracking-wider mb-3">Полная База Вопросов</span>
                                <h2 class="text-3xl font-extrabold mb-3">Интерактивный Тренажер</h2>
                                <p class="text-emerald-100 text-sm leading-relaxed mb-6">База данных содержит 89 вопросов из раздела Общая фармакология.</p>
                            </div>
                            <i class="fa-solid fa-pills text-white/10 text-9xl absolute -bottom-6 -right-6 pointer-events-none"></i>
                        </div>

                        <!-- Settings Card -->
                        <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 md:p-8 shadow-sm border border-slate-200 dark:border-slate-700 space-y-6">
                            
                            <!-- Topic Select -->
                            <div>
                                <label class="block text-sm font-semibold mb-2 text-slate-700 dark:text-slate-300 flex items-center gap-2">
                                    <i class="fa-solid fa-book-bookmark text-emerald-500"></i> Раздел / Тема:
                                </label>
                                <select onchange="app.setTopic(this.value)" class="w-full p-3.5 rounded-2xl border-2 border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-semibold text-sm focus:border-emerald-500 outline-none transition">
                                    <option value="ALL" ${this.selectedTopic === 'ALL' ? 'selected' : ''}>Все темы (${fullQuestionBank.length} вопр.)</option>
                                    ${topics.map(t => {
                                        const count = fullQuestionBank.filter(q => q.topic === t).length;
                                        return `<option value="${t}" ${this.selectedTopic === t ? 'selected' : ''}>${t} (${count} вопр.)</option>`;
                                    }).join('')}
                                </select>
                            </div>

                            <!-- Questions Count Selection -->
                            <div>
                                <label class="block text-sm font-semibold mb-3 text-slate-700 dark:text-slate-300 flex items-center gap-2">
                                    <i class="fa-solid fa-list-ol text-emerald-500"></i> Количество вопросов в тесте:
                                </label>
                                <div class="grid grid-cols-3 sm:grid-cols-5 gap-2.5 mb-3">
                                    <button onclick="app.setCount(10)" id="btn-count-10" class="count-btn p-3 rounded-2xl border-2 font-bold text-xs transition text-center ${this.selectedCount === 10 ? 'border-emerald-500 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 dark:text-emerald-400' : 'border-slate-200 dark:border-slate-700'}">
                                        10 вопр.
                                    </button>
                                    <button onclick="app.setCount(20)" id="btn-count-20" class="count-btn p-3 rounded-2xl border-2 font-bold text-xs transition text-center ${this.selectedCount === 20 ? 'border-emerald-500 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 dark:text-emerald-400' : 'border-slate-200 dark:border-slate-700'}">
                                        20 вопр.
                                    </button>
                                    <button onclick="app.setCount(30)" id="btn-count-30" class="count-btn p-3 rounded-2xl border-2 font-bold text-xs transition text-center ${this.selectedCount === 30 ? 'border-emerald-500 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 dark:text-emerald-400' : 'border-slate-200 dark:border-slate-700'}">
                                        30 вопр.
                                    </button>
                                    <button onclick="app.setCount(50)" id="btn-count-50" class="count-btn p-3 rounded-2xl border-2 font-bold text-xs transition text-center ${this.selectedCount === 50 ? 'border-emerald-500 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 dark:text-emerald-400' : 'border-slate-200 dark:border-slate-700'}">
                                        50 вопр.
                                    </button>
                                    <button onclick="app.setCount('ALL')" id="btn-count-ALL" class="count-btn p-3 rounded-2xl border-2 font-bold text-xs transition text-center ${this.selectedCount === 'ALL' ? 'border-emerald-500 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 dark:text-emerald-400' : 'border-slate-200 dark:border-slate-700'}">
                                        Все (${availableQuestions.length})
                                    </button>
                                </div>

                                <!-- Custom Input Number -->
                                <div class="flex items-center gap-3">
                                    <span class="text-xs text-slate-500 font-medium shrink-0">Или задайте нужное количество:</span>
                                    <input 
                                        type="number" 
                                        min="1" 
                                        max="${availableQuestions.length}" 
                                        placeholder="1-${availableQuestions.length}" 
                                        id="custom-count-input"

                                        class="w-full p-2.5 px-3 rounded-xl border-2 border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm font-semibold focus:border-emerald-500 outline-none transition"
                                    />

                            <button onclick="app.startQuiz()" class="w-full py-4 bg-emerald-500 hover:bg-emerald-600 text-white font-extrabold rounded-2xl shadow-lg shadow-emerald-500/25 transition active:scale-98 flex items-center justify-center gap-2 text-lg">

                        </div>

            setTopic(topic) {

                this.renderHome(document.getElementById('app-container'));
            }

            setCount(count) {
                this.selectedCount = count;
                const input = document.getElementById('custom-count-input');
                if (input) input.value = '';
                
                document.querySelectorAll('.count-btn').forEach(btn => {
                    btn.className = "count-btn p-3 rounded-2xl border-2 font-bold text-xs transition text-center border-slate-200 dark:border-slate-700";
                });
                const activeBtn = document.getElementById(`btn-count-${count}`);
                if (activeBtn) {
                    activeBtn.className = "count-btn p-3 rounded-2xl border-2 font-bold text-xs transition text-center border-emerald-500 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 dark:text-emerald-400";
                }
            }

            setCustomCount(val) {
                const availableCount = this.getFilteredQuestions().length;
                let num = parseInt(val, 10);
                if (isNaN(num) || num < 1) return;
                if (num > availableCount) num = availableCount;
                
                this.selectedCount = num;
                document.querySelectorAll('.count-btn').forEach(btn => {
                    btn.className = "count-btn p-3 rounded-2xl border-2 font-bold text-xs transition text-center border-slate-200 dark:border-slate-700";
                });
            }

            startQuiz() {
                const pool = this.getFilteredQuestions();
                if (pool.length === 0) return;

                const countToPick = this.selectedCount === 'ALL' ? pool.length : Math.min(parseInt(this.selectedCount, 10) || pool.length, pool.length);
                const shuffledBank = shuffleArray(pool);
                const pickedQuestions = shuffledBank.slice(0, countToPick);

                // Shuffle options for each question while preserving correct answer mappings
                this.activeQuestions = pickedQuestions.map(q => {
                    const optionObjects = q.options.map((opt, idx) => ({
                        text: opt,
                        isCorrect: q.answers.includes(idx)
                    }));
                    const shuffledOptions = shuffleArray(optionObjects);

                    return {
                        id: q.id,
                        topic: q.topic,
                        question: q.question,
                        shuffledOptions: shuffledOptions,
                        isMultiple: shuffledOptions.filter(o => o.isCorrect).length > 1
                    };
                });

                this.state = {
                    currentIdx: 0,
                    score: 0,
                    userAnswers: [],
                    selectedIndices: [],
                    isAnswerSubmitted: false
                };

                this.navTo('play');
            }

            renderPlay(container) {
                const q = this.activeQuestions[this.state.currentIdx];
                const total = this.activeQuestions.length;
                const progressPct = ((this.state.currentIdx) / total) * 100;

                container.innerHTML = `
                    <div class="max-w-2xl mx-auto">
                        <!-- Progress Header -->
                        <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-slate-200 dark:border-slate-700 mb-6">
                            <div class="flex items-center justify-between mb-2">
                                <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">
                                    Вопрос ${this.state.currentIdx + 1} из ${total}
                                </span>
                                <span class="text-xs font-bold ${q.isMultiple ? 'text-amber-500 bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-900' : 'text-emerald-500 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-900'} px-2.5 py-1 rounded-lg">
                                    ${q.isMultiple ? 'Выберите несколько ответов' : 'Выберите один ответ'}
                                </span>
                            </div>
                            <div class="w-full h-2.5 bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden">
                                <div class="h-full bg-emerald-500 transition-all duration-300" style="width: ${progressPct}%"></div>
                            </div>
                        </div>

                        <!-- Question Card -->
                        <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 md:p-8 shadow-sm border border-slate-200 dark:border-slate-700 mb-6">
                            <div class="text-xs font-semibold text-emerald-600 dark:text-emerald-400 mb-2 uppercase tracking-wide">
                                <i class="fa-solid fa-tag mr-1"></i> ${q.topic}
                            </div>
                            <h2 class="text-xl md:text-2xl font-bold mb-6 text-slate-800 dark:text-slate-100 leading-snug">
                                ${q.question}
                            </h2>

                            <!-- Options -->
                            <div class="space-y-3" id="options-box">
                                ${q.shuffledOptions.map((opt, idx) => {
                                    const isSelected = this.state.selectedIndices.includes(idx);
                                    let borderStyle = "border-slate-200 dark:border-slate-700 hover:border-slate-300";
                                    let bgStyle = "";
                                    let checkIcon = isSelected ? (q.isMultiple ? '<i class="fa-solid fa-check"></i>' : '') : '';
                                    let checkCircleStyle = isSelected ? 'border-emerald-500 bg-emerald-500 text-white' : 'border-slate-300 dark:border-slate-600';

                                    // Highlight options after submitting
                                    if (this.state.isAnswerSubmitted) {
                                        if (opt.isCorrect) {
                                            borderStyle = "border-emerald-500";
                                            bgStyle = "bg-emerald-50 dark:bg-emerald-950/50 text-emerald-900 dark:text-emerald-200 font-semibold";
                                            checkCircleStyle = "border-emerald-600 bg-emerald-600 text-white";
                                            checkIcon = '<i class="fa-solid fa-check"></i>';
                                        } else if (isSelected && !opt.isCorrect) {
                                            borderStyle = "border-rose-500";
                                            bgStyle = "bg-rose-50 dark:bg-rose-950/50 text-rose-900 dark:text-rose-200 font-semibold";
                                            checkCircleStyle = "border-rose-600 bg-rose-600 text-white";
                                            checkIcon = '<i class="fa-solid fa-xmark"></i>';
                                        }
                                    } else if (isSelected) {
                                        borderStyle = "border-emerald-500";
                                        bgStyle = "bg-emerald-50/60 dark:bg-emerald-950/30";
                                    }

                                    return `
                                        <div 
                                            onclick="app.toggleOption(${idx})"
                                            class="option-card ${this.state.isAnswerSubmitted ? 'pointer-events-none' : 'cursor-pointer'} p-4 rounded-2xl border-2 ${borderStyle} ${bgStyle} transition flex items-center justify-between select-none">
                                            <div class="flex items-center gap-3 pr-3">
                                                <div class="w-6 h-6 shrink-0 rounded-${q.isMultiple ? 'md' : 'full'} border-2 ${checkCircleStyle} flex items-center justify-center text-xs font-bold transition">
                                                    ${checkIcon}
                                                </div>
                                                <span class="text-base font-medium">${opt.text}</span>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>

                            <!-- Controls Button -->
                            ${!this.state.isAnswerSubmitted ? `
                                <button 
                                    onclick="app.submitAnswer()"
                                    id="submit-btn"
                                    ${this.state.selectedIndices.length === 0 ? 'disabled' : ''}
                                    class="w-full mt-6 py-4 bg-emerald-500 hover:bg-emerald-600 disabled:opacity-40 disabled:pointer-events-none text-white font-bold rounded-2xl shadow-md transition active:scale-98">
                                    Подтвердить ответ
                                </button>
                            ` : `
                                <button 
                                    onclick="app.nextQuestion()"
                                    class="w-full mt-6 py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-2xl shadow-md transition active:scale-98 flex items-center justify-center gap-2">
                                    ${this.state.currentIdx + 1 < this.activeQuestions.length ? 'Следующий вопрос <i class="fa-solid fa-arrow-right"></i>' : 'Завершить тест <i class="fa-solid fa-flag-checkered"></i>'}
                                </button>
                            `}
                        </div>
                    </div>
                `;
            }

            toggleOption(idx) {
                if (this.state.isAnswerSubmitted) return;
                const q = this.activeQuestions[this.state.currentIdx];
                if (q.isMultiple) {
                    if (this.state.selectedIndices.includes(idx)) {
                        this.state.selectedIndices = this.state.selectedIndices.filter(i => i !== idx);
                    } else {
                        this.state.selectedIndices.push(idx);
                    }
                } else {
                    this.state.selectedIndices = [idx];
                }

                this.renderPlay(document.getElementById('app-container'));
            }

            submitAnswer() {
                if (this.state.isAnswerSubmitted) return;

                const q = this.activeQuestions[this.state.currentIdx];
                const correctIndices = [];
                q.shuffledOptions.forEach((opt, idx) => {
                    if (opt.isCorrect) correctIndices.push(idx);
                });

                // Check exact match
                const isUserCorrect = correctIndices.length === this.state.selectedIndices.length &&
                    correctIndices.every(idx => this.state.selectedIndices.includes(idx));

                if (isUserCorrect) this.state.score++;

                this.state.userAnswers.push({
                    question: q.question,
                    shuffledOptions: q.shuffledOptions,
                    selectedIndices: [...this.state.selectedIndices],
                    correctIndices: correctIndices,
                    isCorrect: isUserCorrect
                });

                this.state.isAnswerSubmitted = true;
                this.renderPlay(document.getElementById('app-container'));
            }

            nextQuestion() {
                this.state.selectedIndices = [];
                this.state.isAnswerSubmitted = false;
                this.state.currentIdx++;

                if (this.state.currentIdx < this.activeQuestions.length) {
                    this.renderPlay(document.getElementById('app-container'));
                } else {
                    this.finishQuiz();
                }
            }

            finishQuiz() {
                this.navTo('result');
                const pct = Math.round((this.state.score / this.activeQuestions.length) * 100);
                if (pct >= 80) {
                    confetti({ particleCount: 90, spread: 60, origin: { y: 0.6 } });
                }
            }

            renderResult(container) {
                const total = this.activeQuestions.length;
                const score = this.state.score;
                const pct = Math.round((score / total) * 100);

                let badge = "bg-rose-100 text-rose-700 dark:bg-rose-900/40 dark:text-rose-300";
                let title = "Нужно еще повторить материал!";
                if (pct >= 85) {
                    badge = "bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300";
                    title = "Отличные знания материала!";
                } else if (pct >= 60) {
                    badge = "bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300";
                    title = "Хороший результат, но есть ошибки!";
                }

                container.innerHTML = `
                    <div class="max-w-2xl mx-auto space-y-6">
                        <div class="bg-white dark:bg-slate-800 rounded-3xl p-8 shadow-sm border border-slate-200 dark:border-slate-700 text-center">
                            <span class="inline-block px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider mb-4 ${badge}">
                                ${pct}% Результат
                            </span>
                            <h2 class="text-2xl font-extrabold mb-2">${title}</h2>
                            <p class="text-slate-500 dark:text-slate-400 mb-6">Правильных ответов: <span class="font-bold text-slate-800 dark:text-slate-100">${score}</span> из <span class="font-bold text-slate-800 dark:text-slate-100">${total}</span></p>

                            <div class="flex flex-wrap items-center justify-center gap-3">
                                <button onclick="app.startQuiz()" class="px-6 py-3.5 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-2xl shadow-md transition active:scale-95 flex items-center gap-2">
                                    <i class="fa-solid fa-rotate-right"></i> Пройти снова
                                </button>
                                <button onclick="app.navTo('home')" class="px-6 py-3.5 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-bold rounded-2xl transition active:scale-95">
                                    На главную
                                </button>
                            </div>
                        </div>

                        <!-- Breakdown -->
                        <h3 class="text-lg font-bold flex items-center gap-2">
                            <i class="fa-solid fa-square-poll-vertical text-emerald-500"></i> Разбор ваших ответов
                        </h3>

                        <div class="space-y-4">
                            ${this.state.userAnswers.map((ans, idx) => `
                                <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 border ${ans.isCorrect ? 'border-emerald-200 dark:border-emerald-900/50' : 'border-rose-200 dark:border-rose-900/50'} shadow-sm">
                                    <div class="flex items-start justify-between gap-3 mb-3">
                                        <h4 class="font-semibold text-sm leading-snug">
                                            <span class="text-slate-400 mr-1">${idx + 1}.</span> ${ans.question}
                                        </h4>
                                        <span class="shrink-0 px-2 py-0.5 rounded text-xs font-bold ${ans.isCorrect ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300' : 'bg-rose-100 text-rose-700 dark:bg-rose-900/40 dark:text-rose-300'}">
                                            ${ans.isCorrect ? 'Верно' : 'Ошибка'}
                                        </span>
                                    </div>

                                    <div class="space-y-1.5 text-xs">
                                        ${ans.shuffledOptions.map((opt, oIdx) => {
                                            const isSelected = ans.selectedIndices.includes(oIdx);
                                            const isCorrect = ans.correctIndices.includes(oIdx);

                                            let style = "bg-slate-50 dark:bg-slate-900/50 text-slate-600 dark:text-slate-400";
                                            if (isCorrect) {
                                                style = "bg-emerald-100/70 dark:bg-emerald-950/60 text-emerald-900 dark:text-emerald-200 font-bold border border-emerald-300 dark:border-emerald-800";
                                            } else if (isSelected && !isCorrect) {
                                                style = "bg-rose-100/70 dark:bg-rose-950/60 text-rose-900 dark:text-rose-200 font-bold border border-rose-300 dark:border-rose-800";
                                            }

                                            return `
                                                <div class="p-2.5 rounded-xl flex items-center justify-between ${style}">
                                                    <span>${opt.text}</span>
                                                    <span>
                                                        ${isSelected ? '<span class="text-[10px] uppercase font-bold mr-1">(Ваш выбор)</span>' : ''}
                                                        ${isCorrect ? '<i class="fa-solid fa-check text-emerald-600"></i>' : (isSelected ? '<i class="fa-solid fa-xmark text-rose-600"></i>' : '')}
                                                    </span>
                                                </div>
                                            `;
                                        }).join('')}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
        }

        const app = new MedQuizApp();
        app.navTo('home');
    </script>
</body>
</html>
